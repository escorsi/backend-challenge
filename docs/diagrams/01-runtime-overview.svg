<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
<title id="title">Arquitetura em execução</title>
<desc id="description">Uma API modular em NestJS, com persistência no DynamoDB e limites de requisição no Redis.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9BB0"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif">
<rect width="1600" height="1100" fill="#FFFFFF"/>
<rect x="0" y="0" width="1600" height="9" fill="#245BC7"/>
<text x="55" y="66" font-size="36" fill="#15283F" font-weight="700">Arquitetura em execução</text>
<text x="55" y="104" font-size="20" fill="#53657B" font-weight="400">Uma API modular em NestJS, com persistência no DynamoDB e limites de requisição no Redis.</text>
<rect x="355" y="160" width="800" height="730" rx="16" fill="#F5F7FB" stroke="#DCE3ED" stroke-width="1.5"/><text x="385" y="200" font-size="24" fill="#15283F" font-weight="650">API  /  NestJS + Express</text><rect x="55" y="350" width="245" height="170" rx="16" fill="#EAF1FF" stroke="#245BC7" stroke-width="1.5"/><rect x="55" y="368" width="5" height="134" rx="2" fill="#245BC7"/><text x="79" y="387" font-size="23" fill="#15283F" font-weight="650">Cliente HTTP</text><text x="79" y="423" font-size="19" fill="#53657B" font-weight="400">Swagger /api</text><text x="79" y="452" font-size="19" fill="#53657B" font-weight="400">ou consumidor da API</text><text x="79" y="481" font-size="19" fill="#53657B" font-weight="400">JSON + bearer token</text><rect x="390" y="230" width="730" height="115" rx="16" fill="#EAF1FF" stroke="#245BC7" stroke-width="1.5"/><rect x="390" y="248" width="5" height="79" rx="2" fill="#245BC7"/><text x="414" y="267" font-size="23" fill="#15283F" font-weight="650">Entrada HTTP e proteções compartilhadas</text><text x="414" y="303" font-size="18" fill="#53657B" font-weight="400">Request ID · métricas HTTP · limite por IP · validação por rota</text><rect x="390" y="405" width="225" height="175" rx="16" fill="#F2EDFA" stroke="#7550B0" stroke-width="1.5"/><rect x="390" y="423" width="5" height="139" rx="2" fill="#7550B0"/><text x="414" y="442" font-size="23" fill="#15283F" font-weight="650">AuthModule</text><text x="414" y="478" font-size="17" fill="#53657B" font-weight="400">POST /v1/auth/login</text><text x="414" y="507" font-size="17" fill="#53657B" font-weight="400">Verifica credenciais</text><text x="414" y="536" font-size="17" fill="#53657B" font-weight="400">Emite JWT</text><rect x="635" y="405" width="225" height="175" rx="16" fill="#F2EDFA" stroke="#7550B0" stroke-width="1.5"/><rect x="635" y="423" width="5" height="139" rx="2" fill="#7550B0"/><text x="659" y="442" font-size="23" fill="#15283F" font-weight="650">UsersModule</text><text x="659" y="478" font-size="17" fill="#53657B" font-weight="400">POST /v1/users</text><text x="659" y="507" font-size="17" fill="#53657B" font-weight="400">Cadastro público</text><text x="659" y="536" font-size="17" fill="#53657B" font-weight="400">Atribui papel USER</text><rect x="880" y="405" width="240" height="175" rx="16" fill="#F2EDFA" stroke="#7550B0" stroke-width="1.5"/><rect x="880" y="423" width="5" height="139" rx="2" fill="#7550B0"/><text x="904" y="442" font-size="23" fill="#15283F" font-weight="650">ProductsModule</text><text x="904" y="478" font-size="17" fill="#53657B" font-weight="400">GET e POST</text><text x="904" y="507" font-size="17" fill="#53657B" font-weight="400">/v1/products</text><text x="904" y="536" font-size="17" fill="#53657B" font-weight="400">JWT; criação: ADMIN</text><rect x="1220" y="230" width="325" height="145" rx="16" fill="#FFF3DF" stroke="#A15D0B" stroke-width="1.5"/><rect x="1220" y="248" width="5" height="109" rx="2" fill="#A15D0B"/><text x="1244" y="267" font-size="23" fill="#15283F" font-weight="650">Redis</text><text x="1244" y="303" font-size="18" fill="#53657B" font-weight="400">Contadores de rate limit</text><text x="1244" y="332" font-size="18" fill="#53657B" font-weight="400">Compartilhados entre instâncias</text><rect x="1220" y="470" width="325" height="205" rx="16" fill="#FFF3DF" stroke="#A15D0B" stroke-width="1.5"/><rect x="1220" y="488" width="5" height="169" rx="2" fill="#A15D0B"/><text x="1244" y="507" font-size="23" fill="#15283F" font-weight="650">DynamoDB</text><text x="1244" y="543" font-size="18" fill="#53657B" font-weight="400">Users: chave email</text><text x="1244" y="572" font-size="18" fill="#53657B" font-weight="400">Products: chave id</text><text x="1244" y="601" font-size="18" fill="#53657B" font-weight="400">3 índices por status + ordem</text><text x="1244" y="630" font-size="18" fill="#53657B" font-weight="400">Leitura e escrita por adapters</text><rect x="390" y="685" width="730" height="165" rx="16" fill="#E5F5F2" stroke="#007C78" stroke-width="1.5"/><rect x="390" y="703" width="5" height="129" rx="2" fill="#007C78"/><text x="414" y="722" font-size="23" fill="#15283F" font-weight="650">Actuator, logs e tratamento de erros</text><text x="414" y="758" font-size="19" fill="#53657B" font-weight="400">Health público: liveness da API</text><text x="414" y="787" font-size="19" fill="#53657B" font-weight="400">Métricas Prometheus: bearer token próprio</text><text x="414" y="816" font-size="19" fill="#53657B" font-weight="400">Logs JSON e erros HTTP correlacionados por requestId</text><polyline points="300,435 330,435 330,287 390,287" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="65" y="324" font-size="19" fill="#245BC7" font-weight="600">Requisições HTTP</text><polyline points="1120,287 1220,287" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><polyline points="755,345 755,375 502,375 502,405" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><polyline points="755,375 747,375 747,405" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><polyline points="755,375 1000,375 1000,405" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><polyline points="502,580 502,620 1175,620 1175,565 1220,565" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M747 580 V620 M1000 580 V620" fill="none" stroke="#8A9BB0" stroke-width="2.5"/><text x="640" y="651" font-size="18" fill="#53657B" font-weight="400">Ports de aplicação → adapters → AWS SDK</text><rect x="55" y="935" width="1490" height="95" rx="16" fill="#F5F7FB" stroke="#DCE3ED" stroke-width="1.5"/><text x="80" y="970" font-size="17" fill="#245BC7" font-weight="700">AMBIENTE LOCAL</text><text x="80" y="1003" font-size="21" fill="#53657B" font-weight="400">API no host (:3000) · Docker Compose: Redis (:6379) e DynamoDB Local (:8000).</text>
<text x="55" y="1075" font-size="15" fill="#53657B" font-weight="400">BACKEND CHALLENGE  /  Documentação da implementação atual</text>
<text x="1450" y="1075" font-size="15" fill="#53657B" font-weight="600">01</text>
</g></svg>
