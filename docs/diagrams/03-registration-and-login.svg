<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title description">
<title id="title">Cadastro, autenticação e autorização</title>
<desc id="description">Fluxos resumidos de sucesso; os detalhes de proteção e as saídas de erro estão indicados abaixo.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9BB0"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif">
<rect width="1600" height="1250" fill="#FFFFFF"/>
<rect x="0" y="0" width="1600" height="9" fill="#245BC7"/>
<text x="55" y="66" font-size="36" fill="#15283F" font-weight="700">Cadastro, autenticação e autorização</text>
<text x="55" y="104" font-size="20" fill="#53657B" font-weight="400">Fluxos resumidos de sucesso; os detalhes de proteção e as saídas de erro estão indicados abaixo.</text>
<rect x="25" y="155" width="290" height="88" rx="16" fill="#F5F7FB" stroke="#DCE3ED" stroke-width="1.5"/><text x="50" y="190" font-size="23" fill="#15283F" font-weight="650">Cliente</text><text x="50" y="221" font-size="16" fill="#53657B" font-weight="400">HTTP / JSON</text><line x1="170" y1="250" x2="170" y2="1040" stroke="#CFD8E5" stroke-width="2" stroke-dasharray="7 8"/><rect x="405" y="155" width="290" height="88" rx="16" fill="#F5F7FB" stroke="#DCE3ED" stroke-width="1.5"/><text x="430" y="190" font-size="23" fill="#15283F" font-weight="650">Entrada HTTP</text><text x="430" y="221" font-size="16" fill="#53657B" font-weight="400">Controllers, Zod e rate limit</text><line x1="550" y1="250" x2="550" y2="1040" stroke="#CFD8E5" stroke-width="2" stroke-dasharray="7 8"/><rect x="795" y="155" width="290" height="88" rx="16" fill="#F5F7FB" stroke="#DCE3ED" stroke-width="1.5"/><text x="820" y="190" font-size="23" fill="#15283F" font-weight="650">Aplicação</text><text x="820" y="221" font-size="16" fill="#53657B" font-weight="400">CreateUserService / AuthService</text><line x1="940" y1="250" x2="940" y2="1040" stroke="#CFD8E5" stroke-width="2" stroke-dasharray="7 8"/><rect x="1215" y="155" width="290" height="88" rx="16" fill="#F5F7FB" stroke="#DCE3ED" stroke-width="1.5"/><text x="1240" y="190" font-size="23" fill="#15283F" font-weight="650">Infraestrutura</text><text x="1240" y="221" font-size="16" fill="#53657B" font-weight="400">Argon2id, DynamoDB e JWT</text><line x1="1360" y1="250" x2="1360" y2="1040" stroke="#CFD8E5" stroke-width="2" stroke-dasharray="7 8"/><rect x="55" y="268" width="1490" height="43" rx="9" fill="#EAF1FF" stroke="#245BC7" stroke-width="1.5"/><text x="76" y="297" font-size="19" fill="#245BC7" font-weight="700">01  CADASTRO PÚBLICO</text><polyline points="170,350 550,350" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="281.8" y="321" width="156.4" height="25" rx="6" fill="#FFFFFF"/><text x="360" y="340" text-anchor="middle" font-size="18" font-weight="500" fill="#15283F">POST /v1/users</text><polyline points="550,400 940,400" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="614" y="371" width="262" height="25" rx="6" fill="#FFFFFF"/><text x="745" y="390" text-anchor="middle" font-size="18" font-weight="500" fill="#15283F">Validar dados → execute()</text><polyline points="940,450 1360,450" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="966.2" y="421" width="367.59999999999997" height="25" rx="6" fill="#FFFFFF"/><text x="1150" y="440" text-anchor="middle" font-size="18" font-weight="500" fill="#15283F">Hash Argon2id + gravação condicional</text><polyline points="1360,505 940,505" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="937.4" y="476" width="425.2" height="25" rx="6" fill="#FFFFFF"/><text x="1150" y="495" text-anchor="middle" font-size="18" font-weight="500" fill="#15283F">Operação concluída; existência não exposta</text><polyline points="940,560 170,560" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="284.8" y="531" width="540.4" height="25" rx="6" fill="#FFFFFF"/><text x="555" y="550" text-anchor="middle" font-size="18" font-weight="500" fill="#15283F">HTTP 200 · mesma mensagem genérica · sem hash ou token</text><rect x="55" y="605" width="1490" height="43" rx="9" fill="#F2EDFA" stroke="#7550B0" stroke-width="1.5"/><text x="76" y="634" font-size="19" fill="#7550B0" font-weight="700">02  LOGIN E USO DO TOKEN</text><polyline points="170,690 550,690" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="257.8" y="661" width="204.4" height="25" rx="6" fill="#FFFFFF"/><text x="360" y="680" text-anchor="middle" font-size="18" font-weight="500" fill="#15283F">POST /v1/auth/login</text><polyline points="550,740 940,740" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="623.6" y="711" width="242.79999999999998" height="25" rx="6" fill="#FFFFFF"/><text x="745" y="730" text-anchor="middle" font-size="18" font-weight="500" fill="#15283F">Validar dados → login()</text><polyline points="940,790 1360,790" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="947" y="761" width="406" height="25" rx="6" fill="#FFFFFF"/><text x="1150" y="780" text-anchor="middle" font-size="18" font-weight="500" fill="#15283F">Buscar email no DynamoDB; verificar hash</text><polyline points="940,845 1360,845" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="951.8" y="816" width="396.4" height="25" rx="6" fill="#FFFFFF"/><text x="1150" y="835" text-anchor="middle" font-size="18" font-weight="500" fill="#15283F">Credenciais válidas → assinar JWT HS256</text><polyline points="1360,900 940,900" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="1028.6" y="871" width="242.79999999999998" height="25" rx="6" fill="#FFFFFF"/><text x="1150" y="890" text-anchor="middle" font-size="18" font-weight="500" fill="#15283F">accessToken + expiresIn</text><polyline points="940,955 170,955" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="328" y="926" width="454" height="25" rx="6" fill="#FFFFFF"/><text x="555" y="945" text-anchor="middle" font-size="18" font-weight="500" fill="#15283F">HTTP 200 · accessToken, tokenType e expiresIn</text><polyline points="170,1015 550,1015" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="229" y="986" width="262" height="25" rx="6" fill="#FFFFFF"/><text x="360" y="1005" text-anchor="middle" font-size="18" font-weight="500" fill="#15283F">Bearer JWT → /v1/products</text><rect x="55" y="1070" width="730" height="125" rx="16" fill="#F5F7FB" stroke="#DCE3ED" stroke-width="1.5"/><text x="80" y="1107" font-size="19" fill="#53657B" font-weight="400">Validação inválida → 400; credenciais inválidas → 401.</text><text x="80" y="1136" font-size="19" fill="#53657B" font-weight="400">Email inexistente também verifica um hash substituto.</text><text x="80" y="1165" font-size="19" fill="#53657B" font-weight="400">Cadastro não substitui uma conta que já existe.</text><rect x="815" y="1070" width="730" height="125" rx="16" fill="#F5F7FB" stroke="#DCE3ED" stroke-width="1.5"/><text x="840" y="1107" font-size="19" fill="#53657B" font-weight="400">JwtStrategy valida assinatura e expiração localmente.</text><text x="840" y="1136" font-size="19" fill="#53657B" font-weight="400">A autenticação da requisição não consulta Users.</text><text x="840" y="1165" font-size="19" fill="#53657B" font-weight="400">Criar produto exige ADMIN; cadastro público gera USER.</text>
<text x="55" y="1225" font-size="15" fill="#53657B" font-weight="400">BACKEND CHALLENGE  /  Documentação da implementação atual</text>
<text x="1450" y="1225" font-size="15" fill="#53657B" font-weight="600">03</text>
</g></svg>
